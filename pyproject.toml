[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakthrough-zero"
version = "0.1.0"
description = "A small, readable AlphaZero project for Breakthrough"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["tensorflow>=2.15"]
